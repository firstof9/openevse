name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending
categories:
  # 1. Version Resolver Categories (New Schema)
  - type: "version-resolver"
    when:
      labels:
        - "breaking-change"
    semver-increment: "major"

  - type: "version-resolver"
    when:
      labels:
        - "feature"
        - "enhancement"
    semver-increment: "minor"

  - type: "version-resolver"
    when:
      labels:
        - "bug"
        - "fix"
        - "bugfix"
        - "performance"
        - "refactor"
        - "style"
        - "build"
        - "chore"
        - "documentation"
        - "CI"
        - "test"
        - "code-quality"
        - "revert"
    semver-increment: "patch"

  - type: "version-resolver"
    semver-increment: "patch" # Default fallback

  # 2. Changelog Grouping Categories (Updated 'when' syntax)
  - title: "💥 Breaking Change 💥"
    when:
      labels:
        - "breaking-change"

  - title: "✨ New Features ✨"
    when:
      labels:
        - "enhancement"
        - "feature"

  - title: "🐛 Bug Fixes 🐛"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"

  - title: "⚡ Performance ⚡"
    when:
      labels:
        - "performance"

  - title: "🔧 Maintenance 🔧"
    when:
      labels:
        - "chore"
        - "documentation"
        - "maintenance"
        - "repo"
        - "dependencies"
        - "github_actions"
        - "style"
        - "build"
        - "revert"
        - "translations"
    collapse-after: 1

  - title: "🎓 Code Quality 🎓"
    when:
      labels:
        - "code-quality"
        - "refactor"

autolabeler:
  - label: "breaking-change"
    title:
      - '/^[^\\s!]+!(\\( [^)]+ \\))?:/i'
  - label: "feature"
    title:
      - '/^feat\\([^)]+\\):/i'
  - label: "bugfix"
    title:
      - '/^fix\\([^)]+\\):/i'
  - label: "refactor"
    title:
      - '/^refactor\\([^)]+\\):/i'
  - label: "code-quality"
    title:
      - '/^test\\([^)]+\\):/i'
  - label: "CI"
    title:
      - '/^ci\\([^)]+\\):/i'
  - label: "chore"
    title:
      - '/^chore\\([^)]+\\):/i'
  - label: "documentation"
    title:
      - '/^docs\\([^)]+\\):/i'
  - label: "style"
    title:
      - '/^style\\([^)]+\\):/i'
  - label: "performance"
    title:
      - '/^perf\\([^)]+\\):/i'
  - label: "revert"
    title:
      - '/^revert\\([^)]+\\):/i'
  - label: "build"
    title:
      - '/^build\\([^)]+\\):/i'
  - label: "dependencies"
    title:
      - "/^build\\(deps\\):/i"
      - "/^chore\\(deps\\):/i"
  - label: "has-tests"
    files:
      - "tests/**/*"
  - label: "translations"
    files:
      - "custom_components/openevse/translations/**/*"

template: |
  [![Downloads for this release](https://img.shields.io/github/downloads/firstof9/openevse/$RESOLVED_VERSION/total.svg)](https://github.com/firstof9/openevse/releases/$RESOLVED_VERSION)

  $CHANGES

  ## Links
  - [Submit bugs/feature requests](https://github.com/firstof9/openevse/issues)
