release_claim:
  name: Release claim
  description: Releases a claim on a charger.
  target:
    entity:
      integration: openevse
list_claims:
  name: List claims
  description: Lists claims on an EVSE.
  target:
    entity:
      integration: openevse
list_overrides:
  name: List overrides
  description: Lists overrides on an EVSE.
  target:
    entity:
      integration: openevse

get_time:
  name: Get time
  description: Gets time and NTP synchronization status from a charger.
  target:
    entity:
      integration: openevse

set_time:
  name: Set time
  description: Sets charger date, time, timezone, and NTP configuration.
  target:
    entity:
      integration: openevse
  fields:
    time:
      name: Time
      description: Target date and time in ISO-8601 format (e.g. 2026-03-25T15:30:00Z).
      required: false
      example: "2026-03-25T15:30:00Z"
      selector:
        text:
    timezone:
      name: Timezone
      description: POSIX timezone string or location (e.g. Europe/London or America/New_York|EST5EDT,M3.2.0,M11.1.0).
      required: false
      example: "America/New_York|EST5EDT,M3.2.0,M11.1.0"
      selector:
        text:
    sntp:
      name: SNTP enabled
      description: Enable or disable SNTP/NTP time synchronization.
      required: false
      selector:
        boolean:

sync_time:
  name: Sync time
  description: Triggers an immediate NTP time synchronization on the charger.
  target:
    entity:
      integration: openevse

add_rfid_tag:
  name: Learn RFID tag
  description: Puts the charger into RFID learning/pairing mode to add the next scanned RFID tag (requires firmware v4.0.0+).
  target:
    entity:
      integration: openevse

set_rfid_user:
  name: Set RFID user
  description: Assigns or updates a user name or Home Assistant person for an RFID tag (requires firmware v5.0.0+).
  target:
    entity:
      integration: openevse
  fields:
    rfid:
      name: RFID tag ID
      description: The unique RFID tag identifier.
      required: true
      example: "01020304"
      selector:
        text:
    person:
      name: Person
      description: The Home Assistant person to associate with this RFID tag.
      required: false
      example: "person.john_doe"
      selector:
        entity:
          domain: person
    name:
      name: User name
      description: Friendly user name string to associate with the RFID tag (optional if person is selected).
      required: false
      example: "John Doe"
      selector:
        text:

delete_rfid_user:
  name: Delete RFID user
  description: Deletes an RFID tag mapping from the charger (requires firmware v5.0.0+).
  target:
    entity:
      integration: openevse
  fields:
    rfid:
      name: RFID tag ID
      description: The unique RFID tag identifier to delete.
      required: true
      example: "01020304"
      selector:
        text:

get_rfid_users:
  name: Get RFID users
  description: Retrieves the mapping of RFID tags to user names from the charger (requires firmware v5.0.0+).
  target:
    entity:
      integration: openevse

get_certificates:
  name: Get certificates
  description: Retrieves installed certificates from the charger, or a specific certificate by ID (requires firmware v4.0.0+).
  target:
    entity:
      integration: openevse
  fields:
    certificate_id:
      name: Certificate ID
      description: Hexadecimal identifier of a specific certificate to retrieve (leave blank for all).
      required: false
      example: "3a8f"
      selector:
        text:

add_certificate:
  name: Add certificate
  description: Adds or uploads a TLS/SSL certificate to the charger (requires firmware v4.0.0+).
  target:
    entity:
      integration: openevse
  fields:
    name:
      name: Certificate name
      description: Friendly name for the certificate.
      required: true
      example: "Root CA"
      selector:
        text:
    certificate:
      name: Certificate
      description: PEM-encoded certificate string (including BEGIN/END headers).
      required: true
      example: |
        -----BEGIN CERTIFICATE-----
        MIIB/zCCAaagAwIBAgIU...
        -----END CERTIFICATE-----
      selector:
        text:
          multiline: true
    key:
      name: Private key
      description: Optional PEM-encoded private key string for client certificates.
      required: false
      example: |
        -----BEGIN PRIVATE KEY-----
        MIGHAgEAMBMGByqGSM49...
        -----END PRIVATE KEY-----
      selector:
        text:
          multiline: true

delete_certificate:
  name: Delete certificate
  description: Deletes an installed certificate from the charger by hexadecimal ID (requires firmware v4.0.0+).
  target:
    entity:
      integration: openevse
  fields:
    certificate_id:
      name: Certificate ID
      description: Hexadecimal identifier of the certificate to delete.
      required: true
      example: "3a8f"
      selector:
        text:
